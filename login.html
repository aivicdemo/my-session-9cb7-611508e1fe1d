<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My 日報 - ログイン画面</title>
  <style>
    :root {
      /* Primary & Accent */
      --primary: #e8b4a8;
      --primary-hover: #d99a8e;

      /* Background Layers */
      --bg-main: #1a1410;
      --bg-card: #242019;
      --bg-sidebar: #1f1b16;

      /* Border & Divider */
      --border: #3a342d;
      --border-width: 1px;

      /* Text */
      --text: #e8e4df;
      --text-muted: #9a9088;

      /* Top Bar */
      --top-bar-bg: #0f0c0a;
      --top-bar-border: #2a241d;
      --top-bar-text: #d4ccc5;

      /* Typography */
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;

      /* Spacing & Sizing */
      --space-unit: 8px;
      --control-height: 36px;
      --radius-card: 6px;
      --radius-control: 4px;

      /* Shadow & Depth */
      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.6);

      /* Motion */
      --motion-duration: 200ms;

      /* Surface Texture */
      --surface-texture: 
        linear-gradient(90deg, transparent 0%, rgba(232, 180, 168, 0.02) 50%, transparent 100%),
        linear-gradient(0deg, transparent 0%, rgba(232, 180, 168, 0.01) 100%),
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 2px,
          rgba(232, 180, 168, 0.005) 2px,
          rgba(232, 180, 168, 0.005) 4px
        );
      --surface-texture-size: 100% 100%;
      --surface-texture-position: 0 0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      font-family: var(--font-family);
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-unit);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: calc(var(--space-unit) * 3);
    }

    .login-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: calc(var(--space-unit) * 1.5);
    }

    .login-logo {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--primary);
    }

    .login-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .login-card {
      background-color: var(--bg-card);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-card);
      padding: calc(var(--space-unit) * 3);
      box-shadow: var(--shadow-card);
      background-image: var(--surface-texture);
      background-size: var(--surface-texture-size);
      background-position: var(--surface-texture-position);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: calc(var(--space-unit) * 1.5);
    }

    .form-group + .form-group {
      margin-top: calc(var(--space-unit) * 2);
    }

    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      display: block;
      letter-spacing: 0.3px;
    }

    .form-input {
      width: 100%;
      height: var(--control-height);
      padding: 0 calc(var(--space-unit) * 1.5);
      background-color: rgba(0, 0, 0, 0.3);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-control);
      color: var(--text);
      font-family: var(--font-family);
      font-size: 14px;
      transition: all var(--motion-duration) ease;
      outline: none;
    }

    .form-input::placeholder {
      color: var(--text-muted);
      opacity: 0.6;
    }

    .form-input:hover {
      border-color: rgba(232, 180, 168, 0.4);
      background-color: rgba(0, 0, 0, 0.4);
    }

    .form-input:focus {
      border-color: var(--primary);
      background-color: rgba(0, 0, 0, 0.5);
      box-shadow: 0 0 0 3px rgba(232, 180, 168, 0.1);
    }

    .form-input:focus::placeholder {
      opacity: 0.3;
    }

    .login-button {
      width: 100%;
      height: var(--control-height);
      background-color: var(--primary);
      color: #1a1410;
      border: none;
      border-radius: var(--radius-control);
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font-family);
      cursor: pointer;
      transition: all var(--motion-duration) ease;
      letter-spacing: 0.3px;
      margin-top: calc(var(--space-unit) * 1);
    }

    .login-button:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(232, 180, 168, 0.2);
    }

    .login-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(232, 180, 168, 0.15);
    }

    .login-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .login-footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
      padding-top: calc(var(--space-unit) * 2);
      border-top: var(--border-width) solid var(--border);
    }

    .login-footer strong {
      color: var(--primary);
      font-weight: 500;
    }

    @media (max-width: 480px) {
      .login-container {
        gap: calc(var(--space-unit) * 2);
      }

      .login-card {
        padding: calc(var(--space-unit) * 2.5);
      }

      .login-title {
        font-size: 22px;
      }

      .login-logo {
        font-size: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .form-input,
      .login-button {
        transition: none;
      }

      .login-button:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">📋 My 日報</div>
      <div>
        <h1 class="login-title" data-testid="login-title">ログイン</h1>
        <p class="login-subtitle">日報管理業務システムへようこそ</p>
      </div>
    </div>

    <div class="login-card">
      <form data-testid="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">ユーザー名</label>
          <input
            type="text"
            id="username"
            name="username"
            data-testid="username"
            class="form-input"
            placeholder="ユーザー名を入力"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">パスワード</label>
          <input
            type="password"
            id="password"
            name="password"
            data-testid="password"
            class="form-input"
            placeholder="パスワードを入力"
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="login-button" data-testid="login-button">
          ログイン
        </button>
      </form>

      <div class="login-footer">
        <strong>サンプル実装:</strong> どの入力でもログインできます
      </div>
    </div>
  </div>

  <script>
    document.querySelector('[data-testid="login-form"]').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = './index.html';
    });
  </script>
</body>
</html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My 日報</title>
  <style>
:root {
  --primary: #e8b4a8;
  --primary-hover: #d99a8e;
  --bg-main: #1a1410;
  --bg-card: #242019;
  --bg-sidebar: #1f1b16;
  --border: #3a342d;
  --border-width: 1px;
  --text: #e8e4df;
  --text-muted: #9a9088;
  --top-bar-bg: #0f0c0a;
  --top-bar-border: #2a241d;
  --top-bar-text: #d4ccc5;
  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  --space-unit: 8px;
  --control-height: 36px;
  --radius-card: 6px;
  --radius-control: 4px;
  --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.6);
  --motion-duration: 200ms;
  --surface-texture: 
    linear-gradient(90deg, transparent 0%, rgba(232, 180, 168, 0.02) 50%, transparent 100%),
    linear-gradient(0deg, transparent 0%, rgba(232, 180, 168, 0.01) 100%),
    repeating-linear-gradient(
      45deg,
      transparent,
      transparent 2px,
      rgba(232, 180, 168, 0.005) 2px,
      rgba(232, 180, 168, 0.005) 4px
    );
  --surface-texture-size: 100% 100%;
  --surface-texture-position: 0 0;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: var(--font-family);
  background: var(--bg-main);
  color: var(--text);
  line-height: 1.5;
}

body {
  display: flex;
  flex-direction: column;
}

[data-aivic-shell-pattern="sidebar"] {
  display: flex;
  flex-direction: row;
  width: 100%;
  height: 100%;
}

.shell-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 56px;
  background: var(--top-bar-bg);
  border-bottom: var(--border-width) solid var(--top-bar-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  z-index: 100;
}

.shell-header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.shell-logo {
  font-size: 14px;
  font-weight: 600;
  color: var(--top-bar-text);
  letter-spacing: 0.5px;
}

.shell-header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  color: #fff;
}

.user-name {
  font-size: 13px;
  color: var(--top-bar-text);
}

.logout-link {
  font-size: 12px;
  color: var(--text-muted);
  text-decoration: none;
  transition: color var(--motion-duration);
}

.logout-link:hover {
  color: var(--primary);
}

.shell-sidebar {
  position: fixed;
  left: 0;
  top: 56px;
  width: 200px;
  height: calc(100vh - 56px);
  background: var(--bg-sidebar);
  border-right: var(--border-width) solid var(--border);
  overflow-y: auto;
  padding: 24px 0;
}

.sidebar-nav {
  list-style: none;
}

.sidebar-nav-item {
  margin: 0;
}

.sidebar-nav-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  font-size: 13px;
  color: var(--text-muted);
  text-decoration: none;
  cursor: pointer;
  transition: all var(--motion-duration);
  border-left: 3px solid transparent;
}

.sidebar-nav-link:hover {
  color: var(--text);
  background: rgba(232, 180, 168, 0.05);
}

.sidebar-nav-link.aivic-active {
  color: var(--primary);
  border-left-color: var(--primary);
  background: rgba(232, 180, 168, 0.08);
}

.content-wrapper {
  margin-left: 200px;
  margin-top: 56px;
  width: calc(100% - 200px);
  height: calc(100vh - 56px);
  overflow-y: auto;
}

.content-area {
  width: 100%;
  height: 100%;
  background: var(--bg-main);
  background-image: var(--surface-texture);
  background-size: var(--surface-texture-size);
  background-position: var(--surface-texture-position);
}

[data-aivic-panel] {
  width: 100%;
  height: 100%;
  padding: 32px;
  overflow-y: auto;
}

.card {
  background: var(--bg-card);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-card);
  padding: 20px;
  box-shadow: var(--shadow-card);
  transition: all var(--motion-duration);
}

.card:hover {
  border-color: rgba(232, 180, 168, 0.3);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: var(--control-height);
  padding: 0 16px;
  font-size: 13px;
  font-weight: 500;
  border: var(--border-width) solid transparent;
  border-radius: var(--radius-control);
  cursor: pointer;
  transition: all var(--motion-duration);
  font-family: var(--font-family);
}

.btn-primary {
  background: var(--primary);
  color: #fff;
}

.btn-primary:hover {
  background: var(--primary-hover);
}

.btn-primary:disabled {
  background: var(--text-muted);
  cursor: not-allowed;
  opacity: 0.5;
}

.btn-secondary {
  background: transparent;
  color: var(--text-muted);
  border-color: var(--border);
}

.btn-secondary:hover {
  color: var(--text);
  border-color: var(--text-muted);
}

.btn-icon {
  width: var(--control-height);
  padding: 0;
  background: transparent;
  color: var(--text-muted);
  border: none;
}

.btn-icon:hover {
  color: var(--text);
}

.input-field {
  width: 100%;
  height: var(--control-height);
  padding: 0 12px;
  font-size: 13px;
  background: var(--bg-main);
  color: var(--text);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-control);
  font-family: var(--font-family);
  transition: all var(--motion-duration);
}

.input-field:focus {
  outline: none;
  border-color: var(--primary-hover);
  box-shadow: 0 0 0 2px rgba(232, 180, 168, 0.1);
}

.textarea-field {
  width: 100%;
  min-height: 200px;
  padding: 12px;
  font-size: 13px;
  background: var(--bg-main);
  color: var(--text);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-control);
  font-family: var(--font-family);
  resize: vertical;
  transition: all var(--motion-duration);
}

.textarea-field:focus {
  outline: none;
  border-color: var(--primary-hover);
  box-shadow: 0 0 0 2px rgba(232, 180, 168, 0.1);
}

.textarea-field::placeholder {
  color: var(--text-muted);
}

.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.button-group {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.button-group-vertical {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 500;
  border-radius: var(--radius-control);
  background: rgba(232, 180, 168, 0.1);
  color: var(--primary);
}

.status-badge.draft {
  background: rgba(154, 144, 136, 0.1);
  color: var(--text-muted);
}

.status-badge.submitted {
  background: rgba(232, 180, 168, 0.15);
  color: var(--primary);
}

.text-muted {
  color: var(--text-muted);
  font-size: 12px;
}

.divider {
  height: var(--border-width);
  background: var(--border);
  margin: 20px 0;
}

.grid-2col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

.section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 16px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.table thead {
  border-bottom: var(--border-width) solid var(--border);
}

.table th {
  padding: 12px;
  text-align: left;
  font-weight: 600;
  color: var(--text-muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.table td {
  padding: 12px;
  border-bottom: var(--border-width) solid var(--border);
  color: var(--text);
}

.table tbody tr:hover {
  background: rgba(232, 180, 168, 0.05);
}

.summary-card {
  background: var(--bg-card);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-card);
  padding: 20px;
  text-align: center;
}

.summary-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 4px;
}

.summary-label {
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.member-list {
  list-style: none;
}

.member-item {
  padding: 12px;
  border-bottom: var(--border-width) solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
}

.member-item:last-child {
  border-bottom: none;
}

.member-name {
  color: var(--text);
  font-weight: 500;
}

.member-time {
  color: var(--text-muted);
  font-size: 12px;
}

.icon-check {
  display: inline-block;
  width: 16px;
  height: 16px;
  background: var(--primary);
  border-radius: 50%;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  line-height: 16px;
  text-align: center;
}

.icon-clock {
  display: inline-block;
  width: 16px;
  height: 16px;
  color: var(--text-muted);
  font-size: 12px;
  line-height: 16px;
  text-align: center;
}

.filter-group {
  display: flex;
  gap: 12px;
  align-items: center;
}

.select-field {
  height: var(--control-height);
  padding: 0 12px;
  font-size: 13px;
  background: var(--bg-main);
  color: var(--text);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-control);
  font-family: var(--font-family);
  cursor: pointer;
  transition: all var(--motion-duration);
}

.select-field:focus {
  outline: none;
  border-color: var(--primary-hover);
}

@media (max-width: 1024px) {
  .shell-sidebar {
    width: 160px;
  }
  .content-wrapper {
    margin-left: 160px;
    width: calc(100% - 160px);
  }
  .grid-2col {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 768px) {
  .shell-sidebar {
    position: fixed;
    left: -200px;
    width: 200px;
    transition: left var(--motion-duration);
    z-index: 90;
  }
  .shell-sidebar.open {
    left: 0;
  }
  .content-wrapper {
    margin-left: 0;
    width: 100%;
  }
  [data-aivic-panel] {
    padding: 24px;
  }
}

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const periodFilter = container.querySelector('#periodFilter');\n  const submittedCount = container.querySelector('#submittedCount');\n  const submissionRate = container.querySelector('#submissionRate');\n  const pendingCount = container.querySelector('#pendingCount');\n  const submittedList = container.querySelector('#submittedList');\n  const pendingList = container.querySelector('#pendingList');\n  const tableBody = container.querySelector('#tableBody');\n\n  const teamMembers = [\n    { id: 1, name: '田中太郎' },\n    { id: 2, name: '鈴木花子' },\n    { id: 3, name: '佐藤次郎' },\n    { id: 4, name: '高橋美咲' },\n    { id: 5, name: '伊藤健太' }\n  ];\n\n  function getTodayStr() {\n    const today = new Date();\n    return today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');\n  }\n\n  function formatDate(dateStr) {\n    const date = new Date(dateStr);\n    const year = date.getFullYear();\n    const month = String(date.getMonth() + 1).padStart(2, '0');\n    const day = String(date.getDate()).padStart(2, '0');\n    return year + '年' + month + '月' + day + '日';\n  }\n\n  function formatDateTime(dateStr) {\n    const date = new Date(dateStr);\n    const hours = String(date.getHours()).padStart(2, '0');\n    const minutes = String(date.getMinutes()).padStart(2, '0');\n    return formatDate(dateStr) + ' ' + hours + ':' + minutes;\n  }\n\n  function getMemberStatus(memberId) {\n    if (!tables || !tables.reports) return { submitted: false, lastDate: null };\n    const todayStr = getTodayStr();\n    const report = tables.reports.find(r => r.memberId === memberId && r.reportDate === todayStr && r.status === 'submitted');\n    return { submitted: !!report, lastDate: report ? report.submittedAt : null };\n  }\n\n  function updateDashboard() {\n    const todayStr = getTodayStr();\n    const submitted = teamMembers.filter(m => getMemberStatus(m.id).submitted);\n    const pending = teamMembers.filter(m => !getMemberStatus(m.id).submitted);\n    const rate = Math.round((submitted.length / teamMembers.length) * 100);\n\n    submittedCount.textContent = submitted.length;\n    pendingCount.textContent = pending.length;\n    submissionRate.textContent = rate;\n\n    if (submitted.length > 0) {\n      submittedList.innerHTML = submitted.map(m => `\n        <div class=\"member-item\">\n          <div class=\"member-name\">\n            <div class=\"member-icon\">✓</div>\n            <div>${m.name}</div>\n          </div>\n          <div class=\"member-detail\">${formatDateTime(getMemberStatus(m.id).lastDate || new Date().toISOString())}</div>\n        </div>\n      `).join('');\n    } else {\n      submittedList.innerHTML = '<div class=\"empty-list\">本日提出済みのメンバーはまだいません</div>';\n    }\n\n    if (pending.length > 0) {\n      pendingList.innerHTML = pending.map(m => `\n        <div class=\"member-item\">\n          <div class=\"member-name\">\n            <div class=\"member-icon\">⏱</div>\n            <div>${m.name}</div>\n          </div>\n          <div class=\"member-detail\">未提出</div>\n        </div>\n      `).join('');\n    } else {\n      pendingList.innerHTML = '<div class=\"empty-list\">全メンバーが提出済みです！</div>';\n    }\n\n    const rows = teamMembers.map((m, idx) => {\n      const status = getMemberStatus(m.id);\n      const statusClass = status.submitted ? 'status-submitted' : 'status-pending';\n      const statusText = status.submitted ? '提出済み' : '未提出';\n      const lastDateText = status.lastDate ? formatDateTime(status.lastDate) : '—';\n      return `\n        <tr>\n          <td>${m.name}</td>\n          <td><span class=\"status-badge ${statusClass}\">● ${statusText}</span></td>\n          <td>${lastDateText}</td>\n          <td><button class=\"btn-icon\" data-member-id=\"${m.id}\" title=\"詳細表示\">👁</button></td>\n        </tr>\n      `;\n    }).join('');\n\n    if (rows.length > 0) {\n      tableBody.innerHTML = rows;\n    } else {\n      tableBody.innerHTML = '<tr><td colspan=\"4\" class=\"no-data\"><div class=\"no-data-icon\">📊</div><div class=\"no-data-text\">メンバー情報がありません</div></td></tr>';\n    }\n  }\n\n  periodFilter.addEventListener('change', function(e) {\n    updateDashboard();\n  });\n\n  container.addEventListener('click', function(e) {\n    const btn = e.target.closest('[data-member-id]');\n    if (btn) {\n      const memberId = parseInt(btn.getAttribute('data-member-id'));\n      const member = teamMembers.find(m => m.id === memberId);\n      alert(member.name + 'さんの詳細情報表示機能は実装予定です');\n    }\n  });\n\n  updateDashboard();\n}";
</script>

<script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper ( SPA 版と同じ )
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API ( SPA 版と同じ )
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー ( " + op + " ): APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return;
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。 無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。 抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  document.addEventListener("DOMContentLoaded", function() {
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // AI シェルが SPA 用の初期表示処理を持っていても、マルチページでは
    // このファイルに割り当てられた画面だけを表示する。
    document.querySelectorAll('[data-aivic-panel]').forEach(function(panel) {
      var isCurrent = panel.getAttribute('data-aivic-panel') === pageScreenId;
      panel.style.display = isCurrent ? 'block' : 'none';
    });

    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // content 要素の hidden 強制除去 ( 2026-05-24 Playwright 大量 fail 対応 )
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/\bmodal\b|\bdialog\b|\boverlay\b|\bpopup\b|\bdropdown\b|\btooltip\b/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup") || el.hasAttribute("data-aivic-overlay"))) return true;
      // 【2026-06-25】 class/role が無くても inline で画面を覆う overlay ( position:fixed ) は modal 扱いにして、
      //  content 強制可視化が誤ってダイアログをロード時に表示してしまわないようにする。
      if (el.style && el.style.position === "fixed") return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        if (isModalLike(el)) continue;
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      _aivicReady = true;
    });
  });

  // 【2026-06-27 強化・必ず閉じられる保証】 モーダル/ダイアログを確実に閉じる安全網。
  //  旧版は Esc のみ + セレクタ .overlay が class="modal-overlay" にマッチせず ( クラストークンが別 )
  //  閉じられなかった ( ユーザー報告 2026-06-27: ダイアログが閉じない ) 。 ① Esc ② オーバーレイ背景クリック
  //  ③ 閉じる系ボタン の 3 経路で閉じる。 セレクタは複合クラスも拾うよう [class*="overlay"] を含む。
  //  閉じ方は「開クラス ( active/open/show 等 ) があれば外す ( 再オープン可 ) 、 無ければ inline display:none」。
  //  modal-header 等の sub-part を誤って隠さないため [class*="modal"] は使わない。
  var AIVIC_OVERLAY_SELECTOR = '[class*="overlay"],[data-aivic-overlay],[data-modal],[role="dialog"],[role="alertdialog"]';
  var aivicCloseOverlay = function(el) {
    if (!el || !el.classList) return;
    var openClasses = ["active", "open", "show", "visible", "is-open", "is-active", "show-modal"];
    var removed = false;
    for (var c = 0; c < openClasses.length; c++) {
      if (el.classList.contains(openClasses[c])) { el.classList.remove(openClasses[c]); removed = true; }
    }
    if (!removed && el.style) el.style.display = "none";
  };
  document.addEventListener("keydown", function(e) {
    if (e.key !== "Escape" && e.keyCode !== 27) return;
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  });
  document.addEventListener("click", function(e) {
    var t = e.target;
    if (!t) return;
    if (t.closest) {
      var closer = t.closest('.modal-close,[data-modal-close],[data-close],[data-dismiss]');
      if (closer) {
        var oc = closer.closest(AIVIC_OVERLAY_SELECTOR);
        if (oc) { aivicCloseOverlay(oc); return; }
      }
    }
    // 背景 ( オーバーレイ要素そのもの ) を直接クリックした時のみ閉じる ( モーダル本体クリックでは閉じない ) 。
    if (t.matches && t.matches(AIVIC_OVERLAY_SELECTOR) && t === e.target) {
      aivicCloseOverlay(t);
    }
  });
  // 【2026-06-28 強化・ロード時に必ず閉じる】 生成 AI が overlay を初期 display:none にし忘れた場合でも、
  //  ロード直後にダイアログが画面を覆って操作不能になる事故 ( ユーザー報告 2026-06-28: ダイアログが常に表示され
  //  閉じられない ) を防ぐ。 認識可能な overlay/dialog セレクタに該当する要素はロード時に必ず閉じる
  //  ( 開クラス除去 or display:none ) 。 真にロード時表示すべき業務コンテンツは overlay セレクタに該当しないため
  //  影響しない ( パネルコンテナは data-aivic-panel で別管理 ) 。
  var aivicHideOverlaysOnLoad = function() {
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", aivicHideOverlaysOnLoad);
  } else {
    aivicHideOverlaysOnLoad();
  }
})();

</script>
